<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VK Terminals - Remote</title>
<style>
  :root {
    --bg: #14171c;
    --card: #1d2127;
    --card-border: #2c323b;
    --fg: #e6e8eb;
    --muted: #8b939e;
    --idle: #5a6573;
    --running: #3b82f6;
    --waiting: #f5a623;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(20,23,28,0.92);
    backdrop-filter: blur(8px); padding: 10px 14px; border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
  header .meta { font-size: 11px; color: var(--muted); }
  #list { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    min-height: 44px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card-head:active { background: #232830; }
  .chevron { flex: none; color: var(--muted); font-size: 13px; line-height: 1;
    transition: transform 0.12s ease; }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.idle { background: var(--idle); }
  .dot.running { background: var(--running); box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
  .dot.waiting { background: var(--waiting); box-shadow: 0 0 0 3px rgba(245,166,35,0.22);
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-size: 13px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card-title .cwd { font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.04em; flex: none; }
  .badge.idle { background: #2a2f37; color: #9aa3ae; }
  .badge.running { background: rgba(59,130,246,0.15); color: #7fb0ff; }
  .badge.waiting { background: rgba(245,166,35,0.18); color: #ffce7a; }
  pre.lines { margin: 0; padding: 10px 12px; background: #0d0f13; color: #c8ccd2;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto;
    border-top: 1px solid var(--card-border); }
  .card.collapsed pre.lines, .card.collapsed .actions { display: none; }
  .actions { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button.k { flex: 1 1 auto; min-width: 44px; padding: 9px 6px; border-radius: 8px;
    border: 1px solid var(--card-border); background: #262b33; color: var(--fg);
    font-size: 13px; font-weight: 600; cursor: pointer; }
  button.k:active { background: #323843; }
  button.k.yes { border-color: #2f6b3f; color: #8fe0a6; }
  button.k.no  { border-color: #6b2f2f; color: #f0a3a3; }
  button.k.stop { border-color: #6b5a2f; color: #e8d08a; }
  .sendrow { display: flex; gap: 6px; }
  .sendrow input { flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0d0f13; color: var(--fg); font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
  .sendrow button { padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; }
  .nl-toggle { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px;
    padding: 2px; }
  #err { display: none; background: #4a1e1e; color: #ffb4b4; font-size: 12px; padding: 6px 12px; }
</style>
</head>
<body>
<header>
  <h1>VK Terminals</h1>
  <span class="meta" id="meta">接続中…</span>
</header>
<div id="err"></div>
<div id="list"></div>

<script>
"use strict";
// ANSI エスケープ / 一部制御文字を除去（表示用）
function stripAnsi(s) {
  if (!s) return "";
  return s
    .replace(/\r\n?/g, "\n")  // CR / CRLF を LF に正規化（上書き系ログの表示安定化）
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")  // CSI シーケンス
    .replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "") // OSC
    .replace(/\x1b[PX^_].*?(\x1b\\|\x07)/g, "")
    .replace(/\x1b[@-Z\\-_]/g, "")
    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, ""); // その他制御文字（改行・タブは残す）
}
function tail(s, n) { return s.length > n ? s.slice(s.length - n) : s; }

// スクロール位置の保存・復元。
// このページは Cache-Control: no-store で配信され、#list の中身は読み込み後に
// fetch('/api/states') 完了を待って非同期に描画される（poll() → render()）。
// そのためブラウザ標準の自動スクロール復元は #list がまだ空（ドキュメント高さ≒0）の
// 段階で走り、深い位置を復元できず最上部に戻ってしまう。標準復元を切り、自前で
// sessionStorage（タブ単位・再読込で保持・タブを閉じると消える）に scrollY を保存し、
// 初回描画でカードが入った後に一度だけ復元する。
if ("scrollRestoration" in history) { history.scrollRestoration = "manual"; }
var SCROLL_KEY = "vkt.scrollY";
var restoredScroll = false; // 復元は一度きり（毎回の再描画でスクロールを飛ばさない）
var scrollSaveScheduled = false;
// 復元の再試行上限。初回 render() でドキュメント高さが保存位置に届かない場合、
// 次回以降の poll() で再試行する（端末カードの描画完了が遅れるケースの保険）。
// ただし無制限に再試行すると、高さが永久に届かない状況（端末数が減った等）で
// ずっと後にコンテンツが伸びた瞬間 scrollTo が走りユーザーを引き戻す回帰を招く。
// 目的はあくまでリロード直後の復元なので、最初の数回（≒数秒）だけ再試行して諦める。
var SCROLL_RESTORE_MAX_TRIES = 5;
var scrollRestoreTries = 0;

function saveScrollY() {
  // scroll イベントは高頻度に発火するため requestAnimationFrame で 1 フレーム 1 回に間引く。
  if (scrollSaveScheduled) return;
  scrollSaveScheduled = true;
  requestAnimationFrame(function () {
    scrollSaveScheduled = false;
    try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); }
    catch (e) { /* 保存失敗は無視（プライベートモード等） */ }
  });
}
window.addEventListener("scroll", saveScrollY, { passive: true });

function restoreScrollOnce() {
  if (restoredScroll) return;
  var saved;
  try { saved = sessionStorage.getItem(SCROLL_KEY); }
  catch (e) { saved = null; }
  // 復元すべき値が無い／不正なら、これ以上試す意味がないので確定して終了。
  if (saved == null) { restoredScroll = true; return; }
  var y = parseInt(saved, 10);
  if (isNaN(y) || y <= 0) { restoredScroll = true; return; }
  // まだドキュメント高さが保存位置 y に届いていない場合は、復元フラグを立てずに
  // return して次回 poll() で再試行する（カード描画完了が初回に間に合わないケースの保険）。
  var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  if (maxY < y) {
    // ただし再試行は上限まで。超えたら高さは永久に届かないとみなし諦める
    // （無制限再試行による「後からの引き戻し」回帰を防ぐ）。
    if (++scrollRestoreTries >= SCROLL_RESTORE_MAX_TRIES) restoredScroll = true;
    return;
  }
  // ここまで来たら復元できる。フラグを確定してからレイアウト確定後に復元する
  // （window.scrollTo は最大スクロール量に自動クランプされる）。
  restoredScroll = true;
  requestAnimationFrame(function () { window.scrollTo(0, y); });
}

var errEl = document.getElementById("err");
function showErr(msg) {
  if (!msg) { errEl.style.display = "none"; return; }
  errEl.textContent = msg; errEl.style.display = "block";
}

async function send(termId, input) {
  try {
    var res = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ termId: termId, input: input })
    });
    if (!res.ok) {
      var j = await res.json().catch(function(){ return {}; });
      showErr("送信失敗: " + (j.error || res.status));
    } else {
      showErr("");
    }
  } catch (e) {
    showErr("送信失敗: " + e.message);
  }
}

// quick ボタン定義: ラベルと送る文字列
var QUICK = [
  [
    { label: "1", input: "1", cls: "" },
    { label: "2", input: "2", cls: "" },
    { label: "3", input: "3", cls: "" },
    { label: "↵ Enter", input: "\r", cls: "" }
  ],
  [
    { label: "Yes (y↵)", input: "y\r", cls: "yes" },
    { label: "No (n↵)", input: "n\r", cls: "no" },
    { label: "Esc", input: "\x1b", cls: "" },
    { label: "Ctrl-C", input: "\x03", cls: "stop" }
  ]
];

var list = document.getElementById("list");
var cards = {}; // termId -> { root, pre, name, cwd, dot, badge, head, chevron }

// 折り畳み状態は cards とは独立した plain object で持つ（termId -> bool）。
// 理由: render() 末尾で states から消えた端末は cards[termId].root.remove() され
// cards から消える。端末が一瞬消えて復活すると ensureCard がまっさらな DOM を
// 作り直すため、DOM の classList を状態の真実にすると吹き飛ぶ。collapsed を
// 別管理し、render のカード更新ループで毎回 classList を当て直すことで
// 再描画・復活をまたいで状態を一致させる。
var COLLAPSE_KEY = "vkt.collapsed";
var collapsed = {}; // termId -> bool
try {
  var saved = localStorage.getItem(COLLAPSE_KEY);
  if (saved) {
    var parsed = JSON.parse(saved);
    if (parsed && typeof parsed === "object") collapsed = parsed;
  }
} catch (e) { /* 壊れた JSON でも落とさない */ }

function saveCollapsed() {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }
  catch (e) { /* 保存失敗は無視（プライベートモード等） */ }
}

// chevron / aria-expanded を collapsed 状態に同期
function syncCollapseUI(c, termId) {
  var isCollapsed = !!collapsed[termId];
  c.root.classList.toggle("collapsed", isCollapsed);
  c.head.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
  // chevron のグリフは ▾ 固定。向きは CSS の rotate(-90deg) で表現する。
}

function toggleCollapse(termId) {
  var c = cards[termId];
  if (!c) return;
  collapsed[termId] = !collapsed[termId];
  syncCollapseUI(c, termId);
  saveCollapsed();
}

function ensureCard(termId) {
  if (cards[termId]) return cards[termId];
  var root = document.createElement("div"); root.className = "card";

  var head = document.createElement("div"); head.className = "card-head";
  var dot = document.createElement("span"); dot.className = "dot idle";
  var title = document.createElement("div"); title.className = "card-title";
  var name = document.createElement("div"); name.className = "name";
  var cwd = document.createElement("div"); cwd.className = "cwd";
  title.appendChild(name); title.appendChild(cwd);
  var badge = document.createElement("span"); badge.className = "badge idle"; badge.textContent = "idle";
  var chevron = document.createElement("span"); chevron.className = "chevron";
  chevron.setAttribute("aria-hidden", "true"); chevron.textContent = "▾";
  head.appendChild(dot); head.appendChild(title); head.appendChild(badge); head.appendChild(chevron);

  // ヘッダ帯全体をタップで開閉トグル。将来ヘッダ内に
  // ボタン/入力/リンクを置いた場合の保険で、それらをタップした時はトグルしない。
  head.setAttribute("role", "button");
  head.setAttribute("tabindex", "0");
  function onHeadToggle(e) {
    if (e.target.closest("button, input, a")) return;
    toggleCollapse(termId);
  }
  head.addEventListener("click", onHeadToggle);
  head.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      onHeadToggle(e);
    }
  });

  var pre = document.createElement("pre"); pre.className = "lines";

  var actions = document.createElement("div"); actions.className = "actions";
  QUICK.forEach(function(grp) {
    var row = document.createElement("div"); row.className = "row";
    grp.forEach(function(b) {
      var btn = document.createElement("button");
      btn.className = "k " + b.cls; btn.textContent = b.label;
      btn.addEventListener("click", function() { send(termId, b.input); });
      row.appendChild(btn);
    });
    actions.appendChild(row);
  });
  // 自由入力
  var sendrow = document.createElement("div"); sendrow.className = "sendrow";
  var inp = document.createElement("input");
  inp.type = "text"; inp.placeholder = "コマンド/テキスト"; inp.autocapitalize = "off";
  inp.autocomplete = "off"; inp.spellcheck = false;
  var sbtn = document.createElement("button"); sbtn.textContent = "送信";
  function doSend() {
    var v = inp.value;
    if (v === "") return;
    send(termId, nlToggle.checked ? v + "\r" : v);
    inp.value = "";
  }
  sbtn.addEventListener("click", doSend);
  inp.addEventListener("keydown", function(e) { if (e.key === "Enter") doSend(); });
  sendrow.appendChild(inp); sendrow.appendChild(sbtn);
  var nlLabel = document.createElement("label"); nlLabel.className = "nl-toggle";
  var nlToggle = document.createElement("input"); nlToggle.type = "checkbox"; nlToggle.checked = true;
  nlLabel.appendChild(nlToggle);
  nlLabel.appendChild(document.createTextNode("末尾に改行(↵)を付ける"));

  actions.appendChild(sendrow);
  actions.appendChild(nlLabel);

  root.appendChild(head); root.appendChild(pre); root.appendChild(actions);
  list.appendChild(root);

  cards[termId] = { root: root, pre: pre, name: name, cwd: cwd, dot: dot, badge: badge,
    head: head, chevron: chevron };
  // 復活時を含め、現在の collapsed 状態を初期反映
  syncCollapseUI(cards[termId], termId);
  return cards[termId];
}

function render(data) {
  var terms = data.terminals || {};
  var keys = Object.keys(terms);
  // 並び順: waiting > running > idle、その中は termId 昇順
  var rank = { waiting: 0, running: 1, idle: 2 };
  keys.sort(function(a, b) {
    var ra = rank[terms[a].status] != null ? rank[terms[a].status] : 3;
    var rb = rank[terms[b].status] != null ? rank[terms[b].status] : 3;
    if (ra !== rb) return ra - rb;
    return String(terms[a].termId).localeCompare(String(terms[b].termId), undefined, { numeric: true });
  });

  var seen = {};
  keys.forEach(function(paneId) {
    var t = terms[paneId];
    var termId = String(t.termId);
    seen[termId] = true;
    var c = ensureCard(termId);
    var st = t.status || "idle";
    c.dot.className = "dot " + st;
    c.badge.className = "badge " + st;
    c.badge.textContent = st;
    // displayTitle = apiTitle || taskTitle（main 側 getDisplayTitle と同じ値）。
    // 旧 t.title は存在しないフィールドで常に空だったため、必ず "Terminal N" に
    // フォールバックしていた不具合を修正（issue: モバイル側でタスク名が出ない）。
    var title = t.displayTitle || t.apiTitle || t.taskTitle || "";
    c.name.textContent = title.trim() ? title : ("Terminal " + termId);
    c.cwd.textContent = t.cwdShort || t.cwd || "";
    c.pre.textContent = tail(stripAnsi(t.lastLines || ""), 1400).replace(/\n{3,}/g, "\n\n").trim();
    // 折り畳み状態を毎回当て直す（再描画・端末の消失→復活をまたいで一致させる）
    syncCollapseUI(c, termId);
    // DOM 並び替え
    list.appendChild(c.root);
  });
  // 消えた端末のカードを削除
  Object.keys(cards).forEach(function(termId) {
    if (!seen[termId]) { cards[termId].root.remove(); delete cards[termId]; }
  });

  if (keys.length === 0) {
    if (!document.getElementById("empty")) {
      var e = document.createElement("div"); e.className = "empty"; e.id = "empty";
      e.textContent = "稼働中のターミナルがありません";
      list.appendChild(e);
    }
  } else {
    var e = document.getElementById("empty"); if (e) e.remove();
  }

  var d = new Date(data.updatedAt || Date.now());
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");
  var ss = String(d.getSeconds()).padStart(2, "0");
  document.getElementById("meta").textContent = keys.length + "台 · " + hh + ":" + mm + ":" + ss;
}

async function poll() {
  try {
    var res = await fetch("/api/states", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    render(data);
    // 初回描画でカードが #list に入った後に一度だけスクロール位置を復元する。
    // 2 回目以降のポーリング再描画では呼ばない（ユーザーのスクロール操作と競合させない）。
    restoreScrollOnce();
    showErr("");
  } catch (e) {
    document.getElementById("meta").textContent = "接続エラー";
    showErr("状態取得に失敗: " + e.message);
  }
}

// 自己再帰 setTimeout で逐次実行を保証（setInterval だと前回 fetch 完了前に
// 次が走り、古い結果が新しい結果を上書きしうるため）。
(function loop() {
  poll().finally(function () { setTimeout(loop, 2000); });
})();
</script>
</body>
</html>
