<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VK Terminals</title>
  <!-- xterm.css は相対パス <link> では読み込まない（app.js が require.resolve で注入する）。
       npm 依存としてインストールされた場合、依存が上位の node_modules へホイストされて
       相対パスが 404 になるため（詳細は app.js の「xterm.css の注入」コメントを参照）。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <span class="app-title">VK Terminals</span>
    <!-- 歯車は常時表示（issue #73）。使用状況ビューは設定ディスクリプタの有無に
         かかわらず開けるため、hidden にしない。使用率 80% 超過時は app.js が
         .usage-alert-warn / .usage-alert-crit を付与して警告ドットを重ねる。 -->
    <button id="settings-btn" class="titlebar-btn" title="設定">⚙</button>
  </div>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
