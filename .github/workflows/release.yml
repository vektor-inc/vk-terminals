name: Release

"on":
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          tag="${GITHUB_REF_NAME}"

          awk -v tag="$tag" '
            BEGIN {
              rank["機能追加"] = 1
              rank["New Feature"] = 1
              rank["仕様変更"] = 2
              rank["Spec Change"] = 2
              rank["不具合修正"] = 3
              rank["Bug Fix"] = 3
              rank["デザイン不具合修正"] = 4
              rank["Design Bug Fix"] = 4
              rank["セキュリティ修正"] = 5
              rank["Security Fix"] = 5
              rank["開発環境"] = 6
              rank["Dev Environment"] = 6
              rank["その他"] = 7
              rank["Other"] = 7
            }
            $1 == "##" && $2 == tag && NF == 2 {
              in_section = 1
              next
            }
            in_section && /^##[[:space:]]/ {
              exit
            }
            in_section {
              lines[++n] = $0
            }
            END {
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) {
                start++
              }
              end = n
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) {
                end--
              }
              for (i = start; i <= end; i++) {
                if (lines[i] ~ /^[[:space:]]*$/) {
                  add_entry(entry)
                  entry = ""
                } else if (lines[i] ~ /^-/) {
                  add_entry(entry)
                  entry = lines[i]
                } else if (entry != "") {
                  entry = entry "\n" lines[i]
                } else {
                  entry = lines[i]
                }
              }
              add_entry(entry)

              for (i = 1; i <= 8; i++) {
                if (bucket[i] != "") {
                  if (printed) {
                    printf "\n"
                  }
                  printf "%s", bucket[i]
                  printed = 1
                }
              }
            }
            function add_entry(text, first_line, label, entry_rank, parts) {
              if (text == "") {
                return
              }

              split(text, parts, "\n")
              first_line = parts[1]
              entry_rank = 8

              if (match(first_line, /\[[^][]*\]/)) {
                label = substr(first_line, RSTART + 1, RLENGTH - 2)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", label)
                if (label in rank) {
                  entry_rank = rank[label]
                }
              }

              if (bucket[entry_rank] != "") {
                bucket[entry_rank] = bucket[entry_rank] "\n" text
              } else {
                bucket[entry_rank] = text
              }
            }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            : > release-notes.md
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with CHANGELOG notes
        if: steps.release_notes.outputs.has_notes == 'true'
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md

      - name: Create GitHub Release with generated notes
        if: steps.release_notes.outputs.has_notes != 'true'
        # softprops/action-gh-release v3.0.2
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      # リリース後、vk-orchestrator に「新バージョンが出た」ことを通知して依存ピンの
      # 自動追従（.github/workflows/sync-vk-terminals.yml）を即時起動する。
      # PAT シークレット VK_ORCHESTRATOR_DISPATCH_TOKEN が未設定なら no-op（リリースは
      # 失敗させない）。その場合でも vk-orchestrator 側の schedule が最大1日で追従する。
      - name: Notify vk-orchestrator to sync version
        env:
          DISPATCH_TOKEN: ${{ secrets.VK_ORCHESTRATOR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "VK_ORCHESTRATOR_DISPATCH_TOKEN 未設定のため dispatch をスキップします（vk-orchestrator の schedule が追従します）。"
            exit 0
          fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vektor-inc/vk-orchestrator/dispatches \
            -d '{"event_type":"vk-terminals-released"}'
