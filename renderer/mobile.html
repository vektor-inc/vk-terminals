<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VK Terminals - Remote</title>
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<header>
  <h1>VK Terminals</h1>
  <span class="meta" id="meta">接続中…</span>
</header>
<div id="err"></div>
<!-- 認証切れ表示（issue #313）。Cookie の有効期限切れ・未登録の端末からのアクセス時に
     画面全体を覆う。古いターミナル一覧を残さないよう、表示中は他の要素を JS 側で隠す。
     文面には「認証」「トークン」「Cookie」という語を出さない（利用者向けの案内文言）。 -->
<div id="auth-expired" hidden>
  <div class="auth-expired-box">
    <h2>接続が許可されていません</h2>
    <p>このスマートフォンの登録の有効期限が切れたか、まだ登録されていません。</p>
    <p>パソコンの VK Terminals を開き、設定パネルの「外出先から確認」タブに表示されている初回登録用の URL を、このスマートフォンでもう一度開いてください。</p>
    <button type="button" id="auth-expired-reload">再読み込み</button>
  </div>
</div>
<div id="usage-card" role="group" aria-labelledby="usage-card-title">
  <div class="u-card-title" id="usage-card-title">Claude使用量</div>
  <!-- 公式 usage API 取得時（issue #73）: セッション% / 週間% の 2 バー表示 -->
  <div id="usage-oauth" hidden>
    <div class="u-sec" id="uo-session-sec" hidden>
      <div class="u-sec-head"><span>現在のセッション</span><span class="u-pct" id="uo-session-pct"></span></div>
      <div class="u-track" id="uo-session-track" role="progressbar" aria-label="現在のセッション"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="uo-session-fill"></div></div>
      <div class="u-reset" id="uo-session-reset"></div>
    </div>
    <div class="u-sec" id="uo-weekly-sec" hidden>
      <div class="u-sec-head"><span>週間制限（すべてのモデル）</span><span class="u-pct" id="uo-weekly-pct"></span></div>
      <div class="u-track" id="uo-weekly-track" role="progressbar" aria-label="週間制限（すべてのモデル）"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="uo-weekly-fill"></div></div>
      <div class="u-reset" id="uo-weekly-reset"></div>
    </div>
  </div>
  <!-- フォールバック（トランスクリプト集計）時: 従来表示（issue #69） -->
  <div class="u-line" id="usage-line"><span class="u-bolt">⚡</span><span id="usage-text"></span></div>
  <div class="u-bar" id="usage-bar"><span class="u-marks" id="usage-marks"></span><span id="usage-percent"></span></div>
  <div class="u-note" id="usage-note"></div>
</div>
<!-- Codex 使用量カード（issue #218）。data.codexUsage があれば表示、無ければカードごと隠す。
     PC 版サイドバー（renderer/app.js の renderCodexUsageView）と対称の構造。
     セッション% / 週間% の 2 バー（Claude カードの #usage-oauth と同じ u-sec 構造）と
     トークン数（今日 / 今週）行を持つ。 -->
<div id="codex-usage-card" role="group" aria-labelledby="codex-usage-card-title">
  <div class="u-card-title" id="codex-usage-card-title">Codex使用量</div>
  <!-- 直近値表示中の注記（stale === true のとき） -->
  <div class="u-note" id="co-stale-note" hidden></div>
  <div id="codex-usage-oauth" hidden>
    <div class="u-sec" id="co-session-sec" hidden>
      <div class="u-sec-head"><span>現在のセッション</span><span class="u-pct" id="co-session-pct"></span></div>
      <div class="u-track" id="co-session-track" role="progressbar" aria-label="現在のセッション"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="co-session-fill"></div></div>
      <div class="u-reset" id="co-session-reset"></div>
    </div>
    <div class="u-sec" id="co-weekly-sec" hidden>
      <div class="u-sec-head"><span>週間制限</span><span class="u-pct" id="co-weekly-pct"></span></div>
      <div class="u-track" id="co-weekly-track" role="progressbar" aria-label="週間制限"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="co-weekly-fill"></div></div>
      <div class="u-reset" id="co-weekly-reset"></div>
    </div>
  </div>
  <!-- トークン数（今日 / 今週）。PC 版 buildCodexTokenUsageSection の表記に合わせる。 -->
  <div class="u-tokens" id="co-tokens" hidden>
    <div class="u-tokens-head"><span>トークン数</span><span class="u-tokens-today" id="co-tokens-today"></span></div>
    <div class="u-reset" id="co-tokens-weekly"></div>
  </div>
</div>
<section class="task-list" id="task-list" hidden>
  <button class="task-list-head" id="task-list-head" type="button" aria-controls="task-list-body" aria-expanded="true">
    <span class="task-list-head-main">
      <span class="task-list-chevron" aria-hidden="true">▼</span>
      <span class="task-list-head-text">タスク</span>
    </span>
    <span class="task-list-count" id="task-list-count"></span>
  </button>
  <div class="task-list-body" id="task-list-body">
    <div class="task-list-stale" hidden>orchestrator 停止中</div>
    <select class="task-list-assignee-filter" id="task-list-assignee-filter" aria-label="担当者で絞り込み" hidden></select>
    <div class="task-list-groups"></div>
    <div class="task-list-live" id="task-list-live" aria-live="polite"></div>
  </div>
</section>
<div id="list"></div>
<!-- ペイン追加ボタン（issue #217）。#list の外側直後の兄弟として静的に置く。
     ポーリング再描画は #list 内だけを触るため、このボタンは再生成されず
     フォーカス／disabled 状態が保持される。空状態（#empty 表示中）でも残り、
     再びペインを開く唯一の導線になる。 -->
<button id="add-pane-btn" type="button" aria-label="ペインを追加">
  <span class="add-pane-icon" aria-hidden="true">＋</span>
  <span class="add-pane-label">ペインを追加</span>
</button>
<footer id="app-version-footer"></footer>

<!-- 宣言的ウィジェット（tasks-widget.json）の共有ロジックと共有レンダラ（#229 / vk-orchestrator#182）。
     main.js が GET /widgetContract.js / /widgetView.js で配信する。契約→レンダラの順で読み込む
     （widgetView が window.VKWidgetContract を参照するため）。PC 版 renderer/app.js と描画を共有する。 -->
<script src="/widgetContract.js"></script>
<script src="/widgetView.js"></script>
<script src="/terminalDisplay.js"></script>
<script src="/urlSafety.js"></script>
<script src="/prBadge.js"></script>
<script src="/statusPresentation.js"></script>
<script src="/mobilePreviewText.js"></script>
<script src="/mobile.js"></script>
</body>
</html>
