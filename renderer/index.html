<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VK Terminals</title>
  <!-- xterm.css は相対パス <link> では読み込まない（app.js が require.resolve で注入する）。
       npm 依存としてインストールされた場合、依存が上位の node_modules へホイストされて
       相対パスが 404 になるため（詳細は app.js の「xterm.css の注入」コメントを参照）。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar">
    <span id="usage-indicator" class="usage-indicator" title="Claude の 5 時間ブロックの消費状況" hidden></span>
    <span class="app-title">VK Terminals</span>
    <button id="settings-btn" class="titlebar-btn" title="設定" hidden>⚙</button>
  </div>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
