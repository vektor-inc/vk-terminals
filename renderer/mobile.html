<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VK Terminals - Remote</title>
<style>
  :root {
    --bg: #14171c;
    --card: #1d2127;
    --card-border: #2c323b;
    --fg: #e6e8eb;
    --muted: #8b939e;
    --idle: #5a6573;
    --running: #3b82f6;
    --waiting: #f5a623;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(20,23,28,0.92);
    backdrop-filter: blur(8px); padding: 10px 14px; border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; flex: 1; }
  header .meta { font-size: 11px; color: var(--muted); }
  #list { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    min-height: 44px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card-head:active { background: #232830; }
  .chevron { flex: none; color: var(--muted); font-size: 13px; line-height: 1;
    transition: transform 0.12s ease; }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.idle { background: var(--idle); }
  .dot.running { background: var(--running); box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
  .dot.waiting { background: var(--waiting); box-shadow: 0 0 0 3px rgba(245,166,35,0.22);
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .card-title { flex: 1; min-width: 0; }
  .card-title .name { font-size: 13px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card-title .cwd { font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.04em; flex: none; }
  .badge.idle { background: #2a2f37; color: #9aa3ae; }
  .badge.running { background: rgba(59,130,246,0.15); color: #7fb0ff; }
  .badge.waiting { background: rgba(245,166,35,0.18); color: #ffce7a; }
  /* PR リンク（issue #53）。PC 版の [ PR ↗ ] バッジ（GitHub PR グリーン系）に寄せる。
     ヘッダ帯（暗背景 var(--card)）上に置くため、PC の濃緑ではなく明るい緑文字にする。
     .badge と同じ角丸・font-size に調和させつつ、タップ領域確保のため min-height 32px・
     padding 縦広めにして指で押しやすくする（ヘッダ自体は min-height 44px）。 */
  a.pr-link { display: none; align-items: center; gap: 4px; flex: none;
    font-size: 10px; font-weight: 700; padding: 4px 8px; min-height: 32px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.04em; text-decoration: none;
    background: rgba(63,185,80,0.15); border: 1px solid rgba(63,185,80,0.3); color: #6fd58a; }
  a.pr-link.show { display: inline-flex; }
  a.pr-link:active { background: rgba(63,185,80,0.28); border-color: rgba(63,185,80,0.5); }
  a.pr-link:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
  a.pr-link .pr-icon { font-size: 10px; opacity: 0.85; line-height: 1; flex: none; }
  pre.lines { margin: 0; padding: 10px 12px; background: #0d0f13; color: #c8ccd2;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto;
    border-top: 1px solid var(--card-border); }
  .card.collapsed pre.lines, .card.collapsed .actions { display: none; }
  .actions { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button.k { flex: 1 1 auto; min-width: 44px; padding: 9px 6px; border-radius: 8px;
    border: 1px solid var(--card-border); background: #262b33; color: var(--fg);
    font-size: 13px; font-weight: 600; cursor: pointer; }
  button.k:active { background: #323843; }
  button.k.yes { border-color: #2f6b3f; color: #8fe0a6; }
  button.k.no  { border-color: #6b2f2f; color: #f0a3a3; }
  button.k.stop { border-color: #6b5a2f; color: #e8d08a; }
  /* ペイン終了（issue #100）。実行中プロセスを kill する不可逆操作なので、
     クイックボタン（アウトライン様式）と格を変えた「塗りの赤」にし、
     .actions 最下段に独立した全幅ボタンとして高頻度操作から分離する。 */
  .actions .danger-row { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--card-border); }
  button.k.kill { flex: 1 1 100%; width: 100%; min-height: 44px;
    background: #b03636; border-color: #b03636; color: #fff; font-weight: 700; }
  button.k.kill:active { background: #8f2a2a; border-color: #8f2a2a; }
  button.k.kill:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
  .sendrow { display: flex; gap: 6px; }
  .sendrow input { flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0d0f13; color: var(--fg); font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
  .sendrow button { padding: 9px 14px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; }
  .nl-toggle { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px;
    padding: 2px; }
  #err { display: none; background: #4a1e1e; color: #ffb4b4; font-size: 12px; padding: 6px 12px; }
  /* トークン使用量カード（issue #69）。data.usage があるときだけ #list の先頭に表示する。 */
  #usage-card { display: none; margin: 10px 10px 0; padding: 11px 13px; background: var(--card);
    border: 1px solid var(--card-border); border-radius: 12px; }
  #usage-card.show { display: block; }
  #usage-card .u-line { font-size: 12px; color: var(--fg); font-weight: 600;
    display: flex; align-items: center; gap: 6px; }
  #usage-card .u-line[hidden] { display: none; }
  #usage-card .u-line .u-bolt { font-size: 13px; }
  #usage-card .u-bar { margin-top: 6px; font-size: 12px; color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px; }
  #usage-card .u-bar[hidden] { display: none; }
  #usage-card .u-bar .u-marks { color: var(--running); letter-spacing: 2px; }
  /* ピーク比の意味をモバイルにだけ一度添える補足（UX-1）。 */
  #usage-card .u-note { margin-top: 4px; font-size: 10px; color: var(--muted); }
  #usage-card .u-note[hidden] { display: none; }
  /* 公式 usage API のセッション% / 週間% 2 バー表示（issue #73）。
     公式% のみ閾値カラー（〜70% 青 / 70〜90% アンバー / 90%〜 赤）。
     数値ラベルを必ず併記し、色だけに依存しない。トラックは PC 側と同じ #21262d。 */
  #usage-oauth[hidden] { display: none; }
  #usage-oauth .u-sec { margin-top: 10px; }
  #usage-oauth .u-sec:first-child { margin-top: 0; }
  #usage-oauth .u-sec[hidden] { display: none; }
  #usage-oauth .u-sec-head { display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; font-size: 12px; font-weight: 600; color: var(--fg); }
  #usage-oauth .u-sec-head .u-pct { white-space: nowrap; }
  #usage-oauth .u-track { margin-top: 5px; height: 7px; border-radius: 4px;
    background: #21262d; overflow: hidden; }
  #usage-oauth .u-fill { height: 100%; border-radius: 4px; background: #58a6ff; }
  #usage-oauth .u-fill.level-warn { background: #d29922; }
  #usage-oauth .u-fill.level-crit { background: #f85149; }
  #usage-oauth .u-reset { margin-top: 4px; font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VK Terminals</h1>
  <span class="meta" id="meta">接続中…</span>
</header>
<div id="err"></div>
<div id="usage-card">
  <!-- 公式 usage API 取得時（issue #73）: セッション% / 週間% の 2 バー表示 -->
  <div id="usage-oauth" hidden>
    <div class="u-sec" id="uo-session-sec" hidden>
      <div class="u-sec-head"><span>現在のセッション</span><span class="u-pct" id="uo-session-pct"></span></div>
      <div class="u-track" id="uo-session-track" role="progressbar" aria-label="現在のセッション"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="uo-session-fill"></div></div>
      <div class="u-reset" id="uo-session-reset"></div>
    </div>
    <div class="u-sec" id="uo-weekly-sec" hidden>
      <div class="u-sec-head"><span>週間制限（すべてのモデル）</span><span class="u-pct" id="uo-weekly-pct"></span></div>
      <div class="u-track" id="uo-weekly-track" role="progressbar" aria-label="週間制限（すべてのモデル）"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="u-fill" id="uo-weekly-fill"></div></div>
      <div class="u-reset" id="uo-weekly-reset"></div>
    </div>
  </div>
  <!-- フォールバック（トランスクリプト集計）時: 従来表示（issue #69） -->
  <div class="u-line" id="usage-line"><span class="u-bolt">⚡</span><span id="usage-text"></span></div>
  <div class="u-bar" id="usage-bar"><span class="u-marks" id="usage-marks"></span><span id="usage-percent"></span></div>
  <div class="u-note" id="usage-note"></div>
</div>
<div id="list"></div>

<script>
"use strict";
// ANSI エスケープ / 一部制御文字を除去（表示用）
function stripAnsi(s) {
  if (!s) return "";
  return s
    .replace(/\r\n?/g, "\n")  // CR / CRLF を LF に正規化（上書き系ログの表示安定化）
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")  // CSI シーケンス
    .replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "") // OSC
    .replace(/\x1b[PX^_].*?(\x1b\\|\x07)/g, "")
    .replace(/\x1b[@-Z\\-_]/g, "")
    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, ""); // その他制御文字（改行・タブは残す）
}

// Claude Code などの CLI スピナー / プログレス描画で残りやすい装飾グリフ。
// 入力待ち検知と共有する lastLines には影響させず、モバイルプレビュー表示だけで除去する。
var MOBILE_PREVIEW_DECORATIVE_GLYPH_RE = /[✻✽✶✷✴✳✢✥✦✧✩✪✫✬✭✮✯✰✱✲✵✸✹✺✼✾✿·]/g;
var MOBILE_PREVIEW_READABLE_LINE_RE = /[A-Za-z\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af]/;

function sanitizeMobilePreviewText(s) {
  if (!s) return "";
  return s.split("\n").reduce(function(lines, line) {
    var cleaned = line.replace(MOBILE_PREVIEW_DECORATIVE_GLYPH_RE, "");
    if (cleaned.trim() === "") {
      if (line.trim() === "") lines.push(cleaned);
      return lines;
    }
    if (MOBILE_PREVIEW_READABLE_LINE_RE.test(cleaned)) lines.push(cleaned);
    return lines;
  }, []).join("\n");
}

function tail(s, n) { return s.length > n ? s.slice(s.length - n) : s; }

// href に入れる URL を http(s) のみに制限する防御（issue #53）。
// new URL() で parse し protocol が http:/https: のときだけ true を返す。
// javascript: / data: 等のスキーム注入を防ぐ。これを通った URL だけ href にセットする。
function isSafeHttpUrl(u) {
  if (typeof u !== "string" || !u) return false;
  if (u.length > 2048) return false;
  try {
    var parsed = new URL(u);
    return parsed.protocol === "http:" || parsed.protocol === "https:";
  } catch (e) {
    return false;
  }
}

// スクロール位置の保存・復元。
// このページは Cache-Control: no-store で配信され、#list の中身は読み込み後に
// fetch('/api/states') 完了を待って非同期に描画される（poll() → render()）。
// そのためブラウザ標準の自動スクロール復元は #list がまだ空（ドキュメント高さ≒0）の
// 段階で走り、深い位置を復元できず最上部に戻ってしまう。標準復元を切り、自前で
// sessionStorage（タブ単位・再読込で保持・タブを閉じると消える）に scrollY を保存し、
// 初回描画でカードが入った後に一度だけ復元する。
if ("scrollRestoration" in history) { history.scrollRestoration = "manual"; }
var SCROLL_KEY = "vkt.scrollY";
var restoredScroll = false; // 復元は一度きり（毎回の再描画でスクロールを飛ばさない）
var scrollSaveScheduled = false;
// 復元の再試行上限。初回 render() でドキュメント高さが保存位置に届かない場合、
// 次回以降の poll() で再試行する（端末カードの描画完了が遅れるケースの保険）。
// ただし無制限に再試行すると、高さが永久に届かない状況（端末数が減った等）で
// ずっと後にコンテンツが伸びた瞬間 scrollTo が走りユーザーを引き戻す回帰を招く。
// 目的はあくまでリロード直後の復元なので、最初の数回（≒数秒）だけ再試行して諦める。
var SCROLL_RESTORE_MAX_TRIES = 5;
var scrollRestoreTries = 0;

function saveScrollY() {
  // scroll イベントは高頻度に発火するため requestAnimationFrame で 1 フレーム 1 回に間引く。
  if (scrollSaveScheduled) return;
  scrollSaveScheduled = true;
  requestAnimationFrame(function () {
    scrollSaveScheduled = false;
    try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); }
    catch (e) { /* 保存失敗は無視（プライベートモード等） */ }
  });
}
window.addEventListener("scroll", saveScrollY, { passive: true });

function restoreScrollOnce() {
  if (restoredScroll) return;
  var saved;
  try { saved = sessionStorage.getItem(SCROLL_KEY); }
  catch (e) { saved = null; }
  // 復元すべき値が無い／不正なら、これ以上試す意味がないので確定して終了。
  if (saved == null) { restoredScroll = true; return; }
  var y = parseInt(saved, 10);
  if (isNaN(y) || y <= 0) { restoredScroll = true; return; }
  // まだドキュメント高さが保存位置 y に届いていない場合は、復元フラグを立てずに
  // return して次回 poll() で再試行する（カード描画完了が初回に間に合わないケースの保険）。
  var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  if (maxY < y) {
    // ただし再試行は上限まで。超えたら高さは永久に届かないとみなし諦める
    // （無制限再試行による「後からの引き戻し」回帰を防ぐ）。
    if (++scrollRestoreTries >= SCROLL_RESTORE_MAX_TRIES) restoredScroll = true;
    return;
  }
  // ここまで来たら復元できる。フラグを確定してからレイアウト確定後に復元する
  // （window.scrollTo は最大スクロール量に自動クランプされる）。
  restoredScroll = true;
  requestAnimationFrame(function () { window.scrollTo(0, y); });
}

var errEl = document.getElementById("err");
function showErr(msg) {
  if (!msg) { errEl.style.display = "none"; return; }
  errEl.textContent = msg; errEl.style.display = "block";
}

async function send(termId, input) {
  try {
    var res = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ termId: termId, input: input })
    });
    if (!res.ok) {
      var j = await res.json().catch(function(){ return {}; });
      showErr("送信失敗: " + (j.error || res.status));
    } else {
      showErr("");
    }
  } catch (e) {
    showErr("送信失敗: " + e.message);
  }
}

async function closeTerm(termId, label) {
  var nm = (label && label.trim()) ? label : ("Terminal " + termId);
  if (!window.confirm("「" + nm + "」を終了しますか？\n実行中のプロセス（claude 等）が停止し、元に戻せません。")) return;
  try {
    var res = await fetch("/api/close-pane", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ termId: termId })
    });
    if (!res.ok) {
      var j = await res.json().catch(function(){ return {}; });
      showErr("終了失敗: " + (j.error || res.status));
    } else {
      showErr("");
    }
  } catch (e) {
    showErr("終了失敗: " + e.message);
  }
}

// quick ボタン定義: ラベルと送る文字列
var QUICK = [
  [
    { label: "1", input: "1", cls: "" },
    { label: "2", input: "2", cls: "" },
    { label: "3", input: "3", cls: "" },
    { label: "↵ Enter", input: "\r", cls: "" }
  ],
  [
    { label: "Yes (y↵)", input: "y\r", cls: "yes" },
    { label: "No (n↵)", input: "n\r", cls: "no" },
    { label: "Esc", input: "\x1b", cls: "" },
    { label: "Ctrl-C", input: "\x03", cls: "stop" }
  ]
];

var list = document.getElementById("list");
var cards = {}; // termId -> { root, pre, name, cwd, dot, badge, head, chevron }

// 折り畳み状態は cards とは独立した plain object で持つ（termId -> bool）。
// 理由: render() 末尾で states から消えた端末は cards[termId].root.remove() され
// cards から消える。端末が一瞬消えて復活すると ensureCard がまっさらな DOM を
// 作り直すため、DOM の classList を状態の真実にすると吹き飛ぶ。collapsed を
// 別管理し、render のカード更新ループで毎回 classList を当て直すことで
// 再描画・復活をまたいで状態を一致させる。
var COLLAPSE_KEY = "vkt.collapsed";
var collapsed = {}; // termId -> bool
try {
  var saved = localStorage.getItem(COLLAPSE_KEY);
  if (saved) {
    var parsed = JSON.parse(saved);
    if (parsed && typeof parsed === "object") collapsed = parsed;
  }
} catch (e) { /* 壊れた JSON でも落とさない */ }

function saveCollapsed() {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); }
  catch (e) { /* 保存失敗は無視（プライベートモード等） */ }
}

// chevron / aria-expanded を collapsed 状態に同期
function syncCollapseUI(c, termId) {
  var isCollapsed = !!collapsed[termId];
  c.root.classList.toggle("collapsed", isCollapsed);
  c.head.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
  // chevron のグリフは ▾ 固定。向きは CSS の rotate(-90deg) で表現する。
}

function toggleCollapse(termId) {
  var c = cards[termId];
  if (!c) return;
  collapsed[termId] = !collapsed[termId];
  syncCollapseUI(c, termId);
  saveCollapsed();
}

function ensureCard(termId) {
  if (cards[termId]) return cards[termId];
  var root = document.createElement("div"); root.className = "card";

  var head = document.createElement("div"); head.className = "card-head";
  var dot = document.createElement("span"); dot.className = "dot idle";
  var title = document.createElement("div"); title.className = "card-title";
  var name = document.createElement("div"); name.className = "name";
  var cwd = document.createElement("div"); cwd.className = "cwd";
  title.appendChild(name); title.appendChild(cwd);
  var badge = document.createElement("span"); badge.className = "badge idle"; badge.textContent = "idle";
  // PR リンク（issue #53）。ヘッダ帯に置くことで折り畳んでも残り、PC の「常時表示」方針と整合する。
  // モバイルは通常ブラウザなので実 URL を href に入れた通常リンク（target=_blank）にする。
  // href へのセットは render() 側で isSafeHttpUrl() を通った値だけ行う。
  var prLink = document.createElement("a");
  prLink.className = "pr-link"; // 初期は display:none。.show 付与で表示
  prLink.target = "_blank";
  prLink.rel = "noopener noreferrer";
  prLink.setAttribute("aria-label", "プルリクエストを開く");
  var prLabel = document.createElement("span"); prLabel.textContent = "PR";
  var prIcon = document.createElement("span"); prIcon.className = "pr-icon";
  prIcon.setAttribute("aria-hidden", "true"); prIcon.textContent = "↗";
  prLink.appendChild(prLabel); prLink.appendChild(prIcon);
  var chevron = document.createElement("span"); chevron.className = "chevron";
  chevron.setAttribute("aria-hidden", "true"); chevron.textContent = "▾";
  head.appendChild(dot); head.appendChild(title); head.appendChild(badge);
  head.appendChild(prLink); head.appendChild(chevron);

  // ヘッダ帯全体をタップで開閉トグル。将来ヘッダ内に
  // ボタン/入力/リンクを置いた場合の保険で、それらをタップした時はトグルしない。
  head.setAttribute("role", "button");
  head.setAttribute("tabindex", "0");
  function onHeadToggle(e) {
    if (e.target.closest("button, input, a")) return;
    toggleCollapse(termId);
  }
  head.addEventListener("click", onHeadToggle);
  head.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      onHeadToggle(e);
    }
  });

  var pre = document.createElement("pre"); pre.className = "lines";

  var actions = document.createElement("div"); actions.className = "actions";
  QUICK.forEach(function(grp) {
    var row = document.createElement("div"); row.className = "row";
    grp.forEach(function(b) {
      var btn = document.createElement("button");
      btn.className = "k " + b.cls; btn.textContent = b.label;
      btn.addEventListener("click", function() { send(termId, b.input); });
      row.appendChild(btn);
    });
    actions.appendChild(row);
  });
  // 自由入力
  var sendrow = document.createElement("div"); sendrow.className = "sendrow";
  var inp = document.createElement("input");
  inp.type = "text"; inp.placeholder = "コマンド/テキスト"; inp.autocapitalize = "off";
  inp.autocomplete = "off"; inp.spellcheck = false;
  var sbtn = document.createElement("button"); sbtn.textContent = "送信";
  function doSend() {
    var v = inp.value;
    if (v === "") return;
    send(termId, nlToggle.checked ? v + "\r" : v);
    inp.value = "";
  }
  sbtn.addEventListener("click", doSend);
  inp.addEventListener("keydown", function(e) { if (e.key === "Enter") doSend(); });
  sendrow.appendChild(inp); sendrow.appendChild(sbtn);
  var nlLabel = document.createElement("label"); nlLabel.className = "nl-toggle";
  var nlToggle = document.createElement("input"); nlToggle.type = "checkbox"; nlToggle.checked = true;
  nlLabel.appendChild(nlToggle);
  nlLabel.appendChild(document.createTextNode("末尾に改行(↵)を付ける"));

  actions.appendChild(sendrow);
  actions.appendChild(nlLabel);

  // ペイン終了ボタン（issue #100）。破壊的操作なので最下段・独立行・全幅・塗り赤。
  var killRow = document.createElement("div"); killRow.className = "row danger-row";
  var killBtn = document.createElement("button");
  killBtn.className = "k kill"; killBtn.textContent = "✕ ターミナルを終了";
  killBtn.addEventListener("click", function() { closeTerm(termId, name.textContent); });
  killRow.appendChild(killBtn);
  actions.appendChild(killRow);

  root.appendChild(head); root.appendChild(pre); root.appendChild(actions);
  list.appendChild(root);

  cards[termId] = { root: root, pre: pre, name: name, cwd: cwd, dot: dot, badge: badge,
    prLink: prLink, head: head, chevron: chevron, killBtn: killBtn };
  // 復活時を含め、現在の collapsed 状態を初期反映
  syncCollapseUI(cards[termId], termId);
  return cards[termId];
}

// 使用量カード（issue #69 → #73）。data.usage があれば表示、無ければカードごと隠す。
//   - source === 'oauth'（公式 usage API）: セッション% / 週間% の 2 バー表示。
//     percent は百分率（17 = 17%）、resetAtMs は epoch ms。2 秒ポーリングに相乗りして
//     残り時間表示も自然に追従する。
//   - それ以外（source === 'transcript' フォールバック）: 従来表示のまま。
// 文字列は textContent で入れるので XSS 面も安全。
var usageCard = document.getElementById("usage-card");

// 残り時間（ms）→「◯時間◯分後にリセット」
function fmtRemainingJa(ms) {
  if (typeof ms !== "number" || !isFinite(ms) || ms <= 0) return "まもなくリセット";
  var totalMin = Math.floor(ms / 60000);
  var h = Math.floor(totalMin / 60);
  var m = totalMin % 60;
  if (h > 0) return h + "時間" + m + "分後にリセット";
  if (m > 0) return m + "分後にリセット";
  return "まもなくリセット";
}

// epoch ms →「金 18:59 にリセット」（ローカル時刻）
function fmtResetDayTimeJa(ms) {
  var d = new Date(ms);
  var wd = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");
  return wd + " " + hh + ":" + mm + " にリセット";
}

// 公式データ 1 区分（セッション / 週間）の行を更新する。
// mode: "remaining" は残り時間表示、"datetime" はリセット日時表示。
function renderOauthRow(prefix, entry, mode) {
  var sec = document.getElementById(prefix + "-sec");
  if (!sec) return;
  var pct = entry && typeof entry.percent === "number" && isFinite(entry.percent)
    ? Math.max(0, Math.min(100, entry.percent)) : null;
  if (pct === null) { sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById(prefix + "-pct").textContent = Math.round(pct) + "% 使用済み";
  var fill = document.getElementById(prefix + "-fill");
  fill.style.width = pct + "%";
  // 公式% のみ閾値カラー（〜70% 青 / 70〜90% アンバー / 90%〜 赤）
  fill.className = "u-fill" + (pct >= 90 ? " level-crit" : pct >= 70 ? " level-warn" : "");
  // SR 向け progressbar の現在値を更新（role / min / max は HTML 側で静的付与済み）
  var track = document.getElementById(prefix + "-track");
  if (track) track.setAttribute("aria-valuenow", String(Math.round(pct)));
  var resetEl = document.getElementById(prefix + "-reset");
  if (entry.resetAtMs && isFinite(entry.resetAtMs)) {
    resetEl.textContent = mode === "remaining"
      ? fmtRemainingJa(entry.resetAtMs - Date.now())
      : fmtResetDayTimeJa(entry.resetAtMs);
  } else {
    resetEl.textContent = "";
  }
}

function renderUsage(usage) {
  if (!usageCard) return;
  var oauthBox = document.getElementById("usage-oauth");
  var lineRow = document.getElementById("usage-line");
  var barRow = document.getElementById("usage-bar");
  var noteRow = document.getElementById("usage-note");

  // 公式 usage API 取得時: 2 バー表示（フォールバック行は隠す）
  if (usage && usage.source === "oauth" && (usage.session || usage.weekly)) {
    renderOauthRow("uo-session", usage.session, "remaining");
    renderOauthRow("uo-weekly", usage.weekly, "datetime");
    oauthBox.hidden = false;
    lineRow.hidden = true;
    barRow.hidden = true;
    noteRow.hidden = true;
    usageCard.classList.add("show");
    return;
  }

  // フォールバック（トランスクリプト集計）: 従来表示
  oauthBox.hidden = true;
  if (!usage || !usage.mobileText) {
    usageCard.classList.remove("show");
    return;
  }
  lineRow.hidden = false;
  document.getElementById("usage-text").textContent = usage.mobileText;
  // ピーク比（バー）行は utilization がある時だけ表示。無い時は 0% 誤読を避けて行ごと隠す。
  if (usage.barText) {
    document.getElementById("usage-marks").textContent = usage.bar || "";
    document.getElementById("usage-percent").textContent = usage.barText;
    noteRow.textContent = usage.peakNote || "";
    barRow.hidden = false;
    noteRow.hidden = !usage.peakNote;
  } else {
    barRow.hidden = true;
    noteRow.hidden = true;
  }
  usageCard.classList.add("show");
}

function render(data) {
  renderUsage(data.usage);
  var terms = data.terminals || {};
  var keys = Object.keys(terms);
  // 並び順: waiting > running > idle、その中は termId 昇順
  var rank = { waiting: 0, running: 1, idle: 2 };
  keys.sort(function(a, b) {
    var ra = rank[terms[a].status] != null ? rank[terms[a].status] : 3;
    var rb = rank[terms[b].status] != null ? rank[terms[b].status] : 3;
    if (ra !== rb) return ra - rb;
    return String(terms[a].termId).localeCompare(String(terms[b].termId), undefined, { numeric: true });
  });

  var seen = {};
  keys.forEach(function(paneId, idx) {
    var t = terms[paneId];
    var termId = String(t.termId);
    seen[termId] = true;
    var c = ensureCard(termId);
    var st = t.status || "idle";
    c.dot.className = "dot " + st;
    c.badge.className = "badge " + st;
    c.badge.textContent = st;
    // displayTitle = apiTitle || taskTitle（main 側 getDisplayTitle と同じ値）。
    // 旧 t.title は存在しないフィールドで常に空だったため、必ず "Terminal N" に
    // フォールバックしていた不具合を修正（issue: モバイル側でタスク名が出ない）。
    var title = t.displayTitle || t.apiTitle || t.taskTitle || "";
    c.name.textContent = title.trim() ? title : ("Terminal " + termId);
    c.killBtn.setAttribute("aria-label", (c.name.textContent || ("Terminal " + termId)) + " を終了する（実行中プロセスを停止）");
    c.cwd.textContent = t.cwdShort || t.cwd || "";
    // PR リンク（issue #53）。安全な http(s) URL のときだけ href にセットして表示、
    // そうでなければ href を空にして非表示にする。
    if (isSafeHttpUrl(t.apiPrUrl)) {
      c.prLink.href = t.apiPrUrl;
      c.prLink.title = t.apiPrUrl;
      c.prLink.classList.add("show");
    } else {
      c.prLink.removeAttribute("href");
      c.prLink.removeAttribute("title");
      c.prLink.classList.remove("show");
    }
    c.pre.textContent = sanitizeMobilePreviewText(tail(stripAnsi(t.lastLines || ""), 1400)).replace(/\n{3,}/g, "\n\n").trim();
    // 折り畳み状態を毎回当て直す（再描画・端末の消失→復活をまたいで一致させる）
    syncCollapseUI(c, termId);
    // CSS order で並び替え（DOM移動をやめてモバイルでの入力フォーカス消失を防ぐ）
    c.root.style.order = String(idx);
  });
  // 消えた端末のカードを削除
  Object.keys(cards).forEach(function(termId) {
    if (!seen[termId]) { cards[termId].root.remove(); delete cards[termId]; }
  });

  if (keys.length === 0) {
    if (!document.getElementById("empty")) {
      var e = document.createElement("div"); e.className = "empty"; e.id = "empty";
      e.textContent = "稼働中のターミナルがありません";
      list.appendChild(e);
    }
  } else {
    var e = document.getElementById("empty"); if (e) e.remove();
  }

  var d = new Date(data.updatedAt || Date.now());
  var hh = String(d.getHours()).padStart(2, "0");
  var mm = String(d.getMinutes()).padStart(2, "0");
  var ss = String(d.getSeconds()).padStart(2, "0");
  document.getElementById("meta").textContent = keys.length + "台 · " + hh + ":" + mm + ":" + ss;
}

async function poll() {
  try {
    var res = await fetch("/api/states", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    render(data);
    // 初回描画でカードが #list に入った後に一度だけスクロール位置を復元する。
    // 2 回目以降のポーリング再描画では呼ばない（ユーザーのスクロール操作と競合させない）。
    restoreScrollOnce();
    showErr("");
  } catch (e) {
    document.getElementById("meta").textContent = "接続エラー";
    showErr("状態取得に失敗: " + e.message);
  }
}

// 自己再帰 setTimeout で逐次実行を保証（setInterval だと前回 fetch 完了前に
// 次が走り、古い結果が新しい結果を上書きしうるため）。
(function loop() {
  poll().finally(function () { setTimeout(loop, 2000); });
})();
</script>
</body>
</html>
